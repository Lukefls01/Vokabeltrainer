<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vokabeltrainer Headlight 2</title>
<meta name="theme-color" content="#d9161d">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --red:#d9161d; --red-d:#a80f14; --yellow:#ffc400; --bg:#efe6e6; --card:#ffffff; --ink:#1e1b1c; --muted:#706a6c;
  --line:#e6dcdc; --green:#1f9d55; --green-l:#e3f6ea; --orange:#e98a00; --orange-l:#fff1dc; --wrong:#d43a2f; --wrong-l:#fde6e4;
  --blue:#2563c9; --shadow:0 2px 0 rgba(0,0,0,.06),0 6px 18px rgba(80,20,20,.08); --r:18px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:"Nunito",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.4;min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input{font:inherit}
.wrap{max-width:760px;margin:0 auto;padding:0 14px}

/* Header */
header.top{position:sticky;top:0;z-index:20;background:linear-gradient(135deg,var(--red),#e8343a);color:#fff;box-shadow:0 2px 12px rgba(120,10,10,.25)}
header.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:10px;height:62px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:40px;height:40px;border-radius:12px;background:#fff;color:var(--red);display:grid;place-items:center;font-weight:900;font-size:18px;letter-spacing:-.5px;box-shadow:inset 0 -3px 0 var(--yellow)}
.brand b{display:block;font-size:17px;line-height:1.1;font-weight:900}
.brand small{display:block;font-size:12px;opacity:.85;white-space:nowrap}
.chips{display:flex;align-items:center;gap:6px}
.chip{background:rgba(255,255,255,.18);border-radius:999px;padding:5px 10px;font-weight:800;font-size:13px;white-space:nowrap}
.icon-btn{width:36px;height:36px;border-radius:12px;background:rgba(255,255,255,.18);display:grid;place-items:center;font-size:17px}

main{padding:16px 0 110px}
h2.sec-title{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:22px 4px 10px;font-weight:900}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:16px}
.muted{color:var(--muted)}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}

/* Tabs */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:#fff;border-top:1px solid var(--line);box-shadow:0 -4px 18px rgba(80,20,20,.06)}
nav.tabs .wrap{display:grid;grid-template-columns:repeat(4,1fr);padding:6px 6px 10px}
nav.tabs button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;border-radius:14px;font-size:12px;font-weight:800;color:var(--muted)}
nav.tabs button span{font-size:22px;line-height:1.1;filter:grayscale(.6);opacity:.8}
nav.tabs button.on{color:var(--red);background:#fdeeee}
nav.tabs button.on span{filter:none;opacity:1}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 18px;border-radius:14px;font-weight:900;font-size:16px;background:var(--red);color:#fff;box-shadow:0 4px 0 var(--red-d);transition:transform .06s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--red-d)}
.btn.sec{background:#fff;color:var(--ink);box-shadow:0 0 0 2px var(--line) inset,0 4px 0 var(--line)}
.btn.sec:active{box-shadow:0 0 0 2px var(--line) inset,0 1px 0 var(--line)}
.btn.yellow{background:var(--yellow);color:#3b2a00;box-shadow:0 4px 0 #c99800}
.btn.green{background:var(--green);box-shadow:0 4px 0 #157a40}
.btn.block{width:100%}
.btn.small{padding:9px 12px;font-size:14px;border-radius:12px}
.btn[disabled]{opacity:.45;pointer-events:none}

/* Progress */
.bar{height:10px;border-radius:99px;background:#f1e7e7;overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--yellow),#ffdb4d);transition:width .4s}
.bar.green>i{background:linear-gradient(90deg,#28b463,#4cd182)}
.stars{color:var(--yellow);letter-spacing:1px;font-size:15px}
.stars .off{color:#dccfcf}

/* Overview */
.hero{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center}
.ring{--p:0;width:74px;height:74px;border-radius:50%;background:conic-gradient(var(--green) calc(var(--p)*1%),#efe5e5 0);display:grid;place-items:center}
.ring>div{width:58px;height:58px;border-radius:50%;background:#fff;display:grid;place-items:center;font-weight:900;font-size:17px}
.hero h3{margin:0 0 4px;font-size:18px}
.stat-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.pill{background:#f7efef;border-radius:999px;padding:4px 10px;font-size:13px;font-weight:800;color:#5b4f51}

/* Path */
.unit-banner{border-radius:var(--r);color:#fff;padding:14px 16px;margin:26px 0 6px;box-shadow:var(--shadow);display:flex;align-items:center;gap:12px}
.unit-banner .num{font-size:12px;font-weight:900;opacity:.9;letter-spacing:.06em;text-transform:uppercase}
.unit-banner h3{margin:0;font-size:19px;font-weight:900}
.unit-banner .bar{background:rgba(255,255,255,.3);margin-top:8px;height:8px}
.unit-banner .bar>i{background:#fff}
.path{position:relative;padding:10px 0 4px}
.node{position:relative;display:flex;flex-direction:column;align-items:center;width:150px;margin:8px auto;text-align:center}
.node.l{transform:translateX(-62px)}.node.r{transform:translateX(62px)}
.node .disc{--p:0;--c:var(--red);width:76px;height:76px;border-radius:50%;padding:6px;background:conic-gradient(var(--c) calc(var(--p)*1%),#e8dcdc 0);box-shadow:0 5px 0 rgba(0,0,0,.08)}
.node .disc>div{width:100%;height:100%;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font-size:25px;font-weight:900;box-shadow:inset 0 -5px 0 rgba(0,0,0,.18)}
.node.locked .disc{filter:grayscale(1);opacity:.55}
.node.passed .disc>div{background:linear-gradient(160deg,var(--c),var(--c))}
.node.current .disc{animation:pulse 1.6s infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
.node .lbl{margin-top:7px;font-weight:900;font-size:14px;line-height:1.15}
.node .sub{font-size:12px;color:var(--muted);font-weight:700}
.node.boss .disc{width:90px;height:90px}
.node.current{margin-top:36px}
.node .go{position:absolute;top:-30px;background:#fff;border-radius:10px;padding:3px 9px;font-size:12px;font-weight:900;color:var(--red);box-shadow:var(--shadow);white-space:nowrap}

/* Lists */
.list{display:flex;flex-direction:column;gap:10px}
.item{display:flex;align-items:center;gap:12px;background:#fff;border-radius:16px;padding:12px 14px;box-shadow:var(--shadow);text-align:left;width:100%}
.item .ico{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:22px;flex:none;color:#fff;font-weight:900}
.item b{display:block;font-size:16px}
.item small{display:block;color:var(--muted);font-size:13px;font-weight:700}
.item .right{text-align:right;flex:none}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.acc{background:#fff;border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
.acc>button.head{display:flex;width:100%;align-items:center;gap:12px;padding:12px 14px;text-align:left}
.acc .body{display:none;border-top:1px solid var(--line);padding:6px 10px 10px}
.acc.open .body{display:block}
.acc .chev{transition:transform .2s;color:var(--muted);font-weight:900}
.acc.open .chev{transform:rotate(90deg)}
.srow{display:flex;align-items:center;gap:10px;padding:9px 6px;border-bottom:1px solid #f3ecec}
.srow:last-child{border-bottom:0}
.srow .grow b{font-size:15px}
.mini{display:flex;gap:6px}
.mini button{background:#f7efef;border-radius:10px;padding:7px 10px;font-weight:800;font-size:13px}

/* Overlay screens */
#overlay{position:fixed;inset:0;z-index:40;background:var(--bg);display:none;overflow:auto}
#overlay.on{display:block}
.ov-top{position:sticky;top:0;background:var(--bg);z-index:2}
.ov-top .wrap{display:flex;align-items:center;gap:12px;height:60px}
.xbtn{width:40px;height:40px;border-radius:12px;background:#fff;box-shadow:var(--shadow);font-size:18px;font-weight:900;color:var(--muted);flex:none}
.ov-top .bar{flex:1;height:14px}
.count{font-weight:900;font-size:14px;color:var(--muted);min-width:52px;text-align:right}

/* Quiz */
.qcard{background:#fff;border-radius:22px;box-shadow:var(--shadow);padding:20px 18px 18px;margin-top:6px;text-align:center}
.qlabel{font-size:13px;font-weight:900;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.qflag{display:inline-block;font-size:12px;font-weight:900;border-radius:8px;padding:2px 8px;margin-left:6px;vertical-align:1px}
.qflag.en{background:#e7efff;color:var(--blue)}.qflag.de{background:#fff3cc;color:#7a5a00}
.qword{font-size:clamp(24px,6.5vw,34px);font-weight:900;margin:14px 0 4px;line-height:1.2;word-break:break-word}
.qhint{font-size:14px;color:var(--muted);font-weight:700;min-height:1px}
.say{display:inline-grid;place-items:center;width:38px;height:38px;border-radius:12px;background:#e7efff;font-size:18px;vertical-align:middle;margin-left:6px}
.qbody{margin-top:16px}
.opts{display:grid;gap:10px}
.opt{background:#fff;border-radius:16px;padding:15px 14px;font-weight:800;font-size:17px;box-shadow:0 0 0 2px var(--line) inset,0 4px 0 var(--line);text-align:left;display:flex;gap:12px;align-items:center}
.opt .k{width:26px;height:26px;border-radius:8px;background:#f5eded;display:grid;place-items:center;font-size:13px;color:var(--muted);flex:none}
.opt:active{transform:translateY(2px)}
.opt.ok{background:var(--green-l);box-shadow:0 0 0 2px var(--green) inset,0 4px 0 var(--green)}
.opt.bad{background:var(--wrong-l);box-shadow:0 0 0 2px var(--wrong) inset,0 4px 0 var(--wrong)}
.opt.dim{opacity:.5}
.tf{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tf .opt{justify-content:center;font-size:18px}
.tf-pair{font-size:clamp(20px,5.5vw,28px);font-weight:900;margin:12px 0 2px}
.tf-pair .eq{color:var(--muted);margin:0 8px}
.inp{width:100%;font-size:20px;font-weight:800;padding:15px 16px;border-radius:16px;border:2px solid var(--line);background:#fff;outline:none;color:var(--ink)}
.inp:focus{border-color:var(--blue);box-shadow:0 0 0 4px rgba(37,99,201,.12)}
.inp.ok{border-color:var(--green);background:var(--green-l)}
.inp.bad{border-color:var(--wrong);background:var(--wrong-l)}
.inp.near{border-color:var(--orange);background:var(--orange-l)}
.uml{display:flex;gap:8px;margin-top:10px;justify-content:center}
.uml button{width:46px;height:42px;border-radius:12px;background:#fff;box-shadow:0 0 0 2px var(--line) inset;font-weight:900;font-size:18px}
.vfields{display:grid;gap:10px}
.vfields label{font-size:13px;font-weight:900;color:var(--muted);text-align:left;display:block;margin:0 0 4px 4px}
.actions{display:flex;gap:10px;margin-top:16px}
.actions .btn{flex:1}
.skip{display:block;margin:14px auto 0;color:var(--muted);font-weight:800;font-size:14px;text-decoration:underline}

/* Scramble */
.slots{min-height:62px;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center;padding:10px;border-radius:16px;background:#fff;border:2px dashed var(--line)}
.tiles{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:14px}
.tile{min-width:44px;height:48px;padding:0 12px;border-radius:12px;background:#fff;font-weight:900;font-size:20px;box-shadow:0 0 0 2px var(--line) inset,0 4px 0 var(--line)}
.tile.w{font-size:17px}
.tile.used{visibility:hidden}
.slots .tile{background:#e7efff;box-shadow:0 0 0 2px #bcd0f5 inset,0 3px 0 #bcd0f5}

/* Feedback */
.fb{position:fixed;left:0;right:0;bottom:0;z-index:45;transform:translateY(110%);transition:transform .22s ease}
.fb.on{transform:none}
.fb .wrap{padding:16px 14px 18px}
.fb-in{border-radius:22px 22px 0 0;padding:4px 0 0}
.fb.ok{background:var(--green-l)}.fb.near{background:var(--orange-l)}.fb.bad{background:var(--wrong-l)}
.fb h4{margin:0 0 4px;font-size:20px;font-weight:900}
.fb.ok h4{color:var(--green)}.fb.near h4{color:var(--orange)}.fb.bad h4{color:var(--wrong)}
.fb p{margin:2px 0;font-weight:700}
.fb .sol{font-size:18px;font-weight:900}
.fb .row{margin-top:12px}
.fb .btn{flex:1}
.linkbtn{font-weight:800;font-size:14px;color:var(--muted);text-decoration:underline;padding:8px}

/* Result */
.result{text-align:center;padding-top:20px}
.big-emoji{font-size:64px;line-height:1}
.result h2{margin:8px 0 2px;font-size:26px;font-weight:900}
.score-big{font-size:54px;font-weight:900;color:var(--red);line-height:1.1}
.result .stars{font-size:34px;margin:6px 0}
.mistakes{text-align:left;margin-top:16px}
.mrow{display:flex;justify-content:space-between;gap:10px;padding:10px 4px;border-bottom:1px solid var(--line);font-weight:700}
.mrow:last-child{border-bottom:0}
.mrow .en{font-weight:900}

/* Flashcards */
.fc-wrap{perspective:1200px;margin-top:10px}
.fc{position:relative;height:300px;transform-style:preserve-3d;transition:transform .45s;cursor:pointer}
.fc.flip{transform:rotateY(180deg)}
.fc .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:24px;background:#fff;box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center}
.fc .back{transform:rotateY(180deg);background:#fffbea}
.fc .w{font-size:clamp(26px,7vw,38px);font-weight:900;line-height:1.2;word-break:break-word}
.fc .tap{position:absolute;bottom:14px;font-size:13px;color:var(--muted);font-weight:800}
.seg{display:inline-flex;background:#fff;border-radius:12px;padding:3px;box-shadow:0 0 0 2px var(--line) inset}
.seg button{padding:7px 10px;border-radius:9px;font-weight:900;font-size:13px;color:var(--muted)}
.seg button.on{background:var(--red);color:#fff}

/* Word list */
.wl-row{display:flex;gap:10px;align-items:center;background:#fff;border-radius:14px;padding:10px 12px;margin-bottom:8px;box-shadow:0 1px 0 rgba(0,0,0,.04)}
.wl-row .en{font-weight:900}
.wl-row small{display:block;color:var(--muted);font-weight:700;font-size:12px}
.dot{width:10px;height:10px;border-radius:50%;flex:none;background:#e3d6d6}
.dot.b1{background:#f6b4b0}.dot.b2{background:#ffd666}.dot.b3{background:#9bdcb0}.dot.b4,.dot.b5{background:var(--green)}
.wl-sec{font-weight:900;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:16px 4px 8px}

/* Sheet */
#sheet{position:fixed;inset:0;z-index:60;display:none}
#sheet.on{display:block}
#sheet .dim{position:absolute;inset:0;background:rgba(30,10,10,.45);animation:fade .2s}
#sheet .panel{position:absolute;left:0;right:0;bottom:0;max-height:88vh;overflow:auto;background:var(--bg);border-radius:24px 24px 0 0;animation:up .22s ease}
#sheet .panel .wrap{padding:18px 16px 24px}
@keyframes up{from{transform:translateY(40%);opacity:.4}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}}
.sheet-h{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.sheet-h h3{margin:0;font-size:20px;font-weight:900}
.optrow{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 14px}
.optrow button{padding:9px 13px;border-radius:12px;background:#fff;font-weight:800;box-shadow:0 0 0 2px var(--line) inset}
.optrow button.on{background:var(--red);color:#fff;box-shadow:none}
.toggle{display:flex;align-items:center;justify-content:space-between;background:#fff;border-radius:14px;padding:13px 14px;margin-bottom:8px;font-weight:800}
.sw{width:50px;height:30px;border-radius:99px;background:#dccfcf;position:relative;transition:.2s;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.sw.on{background:var(--green)}.sw.on::after{left:23px}

/* Toast */
#toast{position:fixed;left:50%;top:76px;transform:translateX(-50%) translateY(-20px);opacity:0;z-index:80;background:#2b2224;color:#fff;padding:10px 16px;border-radius:14px;font-weight:800;transition:.25s;pointer-events:none;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%)}

/* Games */
.hud{display:flex;justify-content:space-between;align-items:center;font-weight:900;font-size:16px;margin:4px 0 8px}
.hud .lives{letter-spacing:2px}
.sky{position:relative;height:min(46vh,380px);border-radius:22px;overflow:hidden;background:radial-gradient(ellipse at 50% 120%,#5b2a8a 0,#20123f 55%,#0c0a1f 100%);box-shadow:var(--shadow)}
.sky .star{position:absolute;width:2px;height:2px;background:#fff;border-radius:50%;opacity:.7}
.ground{position:absolute;left:0;right:0;bottom:0;height:18px;background:linear-gradient(#3fb36b,#1d7a45)}
.meteor{position:absolute;left:50%;top:0;transform:translate(-50%,-110%);background:linear-gradient(160deg,#ff9a3c,#e2401c);color:#fff;font-weight:900;font-size:clamp(16px,4.6vw,21px);padding:10px 16px;border-radius:18px;box-shadow:0 0 24px rgba(255,120,40,.7);white-space:nowrap;max-width:92%;overflow:hidden;text-overflow:ellipsis}
.meteor::before{content:"";position:absolute;left:50%;top:-40px;width:14px;height:44px;transform:translateX(-50%);background:linear-gradient(transparent,rgba(255,180,80,.7));border-radius:8px;z-index:-1}
.meteor.boom{animation:boom .35s forwards}
@keyframes boom{to{transform:translate(-50%,var(--y)) scale(1.8);opacity:0;filter:brightness(2)}}
.shake{animation:shake .35s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.flash{position:absolute;inset:0;pointer-events:none;opacity:0}
.flash.red{background:rgba(255,40,40,.35);animation:fl .4s}
@keyframes fl{0%{opacity:1}100%{opacity:0}}
.gopts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.gopts .opt{justify-content:center;text-align:center;font-size:15px;padding:14px 8px;min-height:62px}
.mem{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:8px}
@media(min-width:560px){.mem{grid-template-columns:repeat(4,1fr)}}
.mc{height:96px;border-radius:16px;perspective:800px}
.mc .in{position:relative;width:100%;height:100%;transition:transform .35s;transform-style:preserve-3d}
.mc.open .in,.mc.done .in{transform:rotateY(180deg)}
.mc .f,.mc .b{position:absolute;inset:0;border-radius:16px;display:grid;place-items:center;backface-visibility:hidden;-webkit-backface-visibility:hidden;padding:6px;text-align:center;font-weight:900;font-size:14px;line-height:1.15;word-break:break-word}
.mc .f{background:linear-gradient(150deg,var(--red),#ef5a46);color:#fff;font-size:30px;box-shadow:inset 0 -4px 0 rgba(0,0,0,.15)}
.mc .b{transform:rotateY(180deg);background:#fff;box-shadow:0 0 0 2px var(--line) inset}
.mc .b.en{background:#eef4ff}.mc .b.de{background:#fff8dc}
.mc.done .b{box-shadow:0 0 0 3px var(--green) inset;background:var(--green-l)}
.game-card{display:flex;gap:14px;align-items:center}
.game-card .gi{width:64px;height:64px;border-radius:18px;display:grid;place-items:center;font-size:34px;flex:none}
.hs{font-size:13px;font-weight:800;color:var(--muted)}
.empty{text-align:center;padding:24px 10px;color:var(--muted);font-weight:700}
.confetti{position:fixed;top:-10px;width:10px;height:14px;z-index:90;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg)}}

/* Schreibfeld */
.pad{position:relative;height:220px;border-radius:18px;background-color:#fffef7;box-shadow:0 0 0 2px var(--line) inset,var(--shadow);overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
 background-image:linear-gradient(to right,transparent 30px,#f2a7a7 30px,#f2a7a7 32px,transparent 32px),repeating-linear-gradient(to bottom,transparent 0,transparent 72px,#b9c9ea 72px,#b9c9ea 74px),repeating-linear-gradient(to bottom,transparent 0,transparent 50px,#e1e8f6 50px,#e1e8f6 51px,transparent 51px,transparent 74px)}

function settingsSheet() {
  openSheet(`<div class="sheet-h"><h3>⚙️ Einstellungen</h3></div>
   <button class="toggle" style="width:100%" data-act="setToggle" data-k="sound"><span>🔈 Töne und Vorlesen</span><span class="sw ${P.set.sound ? 'on' : ''}"></span></button>
   <button class="toggle" style="width:100%" data-act="setToggle" data-k="pen"><span>✍️ Fragen mit dem Stift schreiben</span><span class="sw ${P.set.pen ? 'on' : ''}"></span></button>
   ${Recog.ok || P.set.autoRead === false ? `<button class="toggle" style="width:100%" data-act="setToggle" data-k="autoRead"><span>🔎 Handschrift automatisch prüfen lassen<small style="display:block;color:var(--muted);font-weight:700;font-size:12px">Claude liest die Schrift – sonst vergleichst du selbst</small></span><span class="sw ${P.set.autoRead ? 'on' : ''}"></span></button>` : ''}
   <button class="toggle" style="width:100%" data-act="setToggle" data-k="unlockAll"><span>🔓 Alle Stationen im Lernpfad öffnen</span><span class="sw ${P.set.unlockAll ? 'on' : ''}"></span></button>
   <div class="card" style="margin-top:10px;font-weight:700;font-size:14px"><b>Speicherort:</b> ${Sync.state === 'cloud' ? '☁️ in deinem Claude-Konto und auf diesem Gerät' : '📱 auf diesem Gerät (im Browser)'}<br><span class="muted">Level ${level(P.xp)} · ${P.xp} XP · ${Object.keys(P.w).length} Wörter schon geübt</span></div>
   <button class="btn sec block" style="margin-top:14px;color:var(--wrong)" data-act="resetAsk">Fortschritt zurücksetzen</button>`);
}

/* ================= Ereignisse ================= */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const a = el.dataset.act;
  const fns = {
    tab: () => setTab(el.dataset.tab),
    node: () => nodeSheet(+el.dataset.i),
    verbsSheet, settings: settingsSheet,
    closeSheet, close: closeOverlay,
    confirmYes: () => { const f = S.confirmFn; S.confirmFn = null; f && f(); },
    acc: () => { S.open[el.dataset.k] = !S.open[el.dataset.k]; el.parentElement.classList.toggle('open'); },
    cards: () => Cards.start(el.dataset.scope),
    list: () => openList(el.dataset.scope),
    practice: () => startPractice(el.dataset.scope),
    practiceProblems: () => startPractice('problems'),
    practiceWrong: () => startPractice('wrong'),
    testStart: () => testStartSheet(el.dataset.test),
    tcfg: () => { S.tcfg[el.dataset.k] = el.dataset.k === 'n' ? +el.dataset.v : el.dataset.v; $$(`[data-act="tcfg"][data-k="${el.dataset.k}"]`).forEach(b => b.classList.toggle('on', b === el)); },
    testGo: () => { const t = S.tcfg; const nodes = pathNodes(); Quiz.start({ mode: 'test', ids: testIds(t.tid), title: testTitle(t.tid), tid: t.tid, order: t.order, n: t.n, fromPath: nodes.some(n => n.test === t.tid) }); },
    testRetry: () => Quiz.start(S.lastTestCfg),
    quitQuiz: () => Quiz.quit(),
    mc: () => Quiz.mc(+el.dataset.i), tf: () => Quiz.tf(+el.dataset.v),
    tile: () => Quiz.tile(+el.dataset.k), untile: () => Quiz.untile(+el.dataset.k), tileReset: () => Quiz.tileReset(),
    penUndo: () => Quiz.pad && Quiz.pad.undo(), penClear: () => Quiz.pad && Quiz.pad.clear(), penSelf: () => Quiz.penSelf(+el.dataset.v), penSelfOpen: () => Quiz.penSelfOpen(),
    check: () => Quiz.check(), dunno: () => Quiz.dunno(), nextQ: () => Quiz.finalize(), override: () => Quiz.override(),
    uml: () => { const inp = S.lastInput || $('#in0'); if (!inp || inp.readOnly) return; const s = inp.selectionStart ?? inp.value.length, en = inp.selectionEnd ?? inp.value.length; inp.value = inp.value.slice(0, s) + el.dataset.v + inp.value.slice(en); inp.focus(); inp.setSelectionRange(s + 1, s + 1); },
    flip: () => Cards.flip(), cardKnow: () => Cards.next(true), cardAgain: () => Cards.next(false),
    cardDir: () => { Cards.cur.dir = el.dataset.v; Cards.cur.flipped = false; Cards.render(); },
    cardShuffle: () => { const c = Cards.cur; c.queue = shuffle(c.queue); c.flipped = false; Cards.render(); toast('Gemischt 🔀'); },
    gscope: () => { S.gscope = el.dataset.v; render(); },
    meteor: () => Game.meteor(), mAns: () => Game.mAns(+el.dataset.i),
    memory: () => Game.memory(), memFlip: () => Game.memFlip(+el.dataset.i),
    setToggle: () => { const k = el.dataset.k; P.set[k] = !P.set[k]; saveP(); settingsSheet(); render(); },
    resetAsk: () => confirmSheet('Alles zurücksetzen?', 'Alle Ergebnisse, Sterne, XP und Highscores werden gelöscht. Das kann man nicht rückgängig machen.', 'Ja, löschen', () => { const set = P.set; P = freshP(); P.set = set; saveP(); closeSheet(); render(); toast('Fortschritt gelöscht'); })
  };
  if (fns[a]) { e.preventDefault(); fns[a](); }
});
document.addEventListener('focusin', e => { if (e.target.matches && e.target.matches('.inp[data-k]')) S.lastInput = e.target; });
document.addEventListener('keydown', e => {
  const ov = $('#overlay').classList.contains('on');
  if ($('#sheet').classList.contains('on')) { if (e.key === 'Escape') closeSheet(); return; }
  if (!ov) return;
  const c = Quiz.cur;
  if (c && c.q) {
    if (c.pending) { if (e.key === 'Enter') { e.preventDefault(); Quiz.finalize(); } return; }
    if (e.key === 'Enter') {
      e.preventDefault();
      if (c.q.fields) { const k = +(document.activeElement && document.activeElement.dataset ? document.activeElement.dataset.k : 0); if (c.q.fields.length > 1 && k < c.q.fields.length - 1 && document.activeElement.classList.contains('inp')) { $('#in' + (k + 1)).focus(); return; } Quiz.check(); }
      else if (c.q.type === 'scramble' || c.q.pen) Quiz.check();
      return;
    }
    if (c.q.opts && /^[1-4]$/.test(e.key)) { Quiz.mc(+e.key - 1); return; }
    if (c.q.type === 'tf' && (e.key === 'j' || e.key === 'n')) { Quiz.tf(e.key === 'j' ? 1 : 0); return; }
  }
  if (Cards.cur && $('.fc')) { if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); Cards.flip(); } else if (e.key === 'ArrowRight') Cards.next(true); else if (e.key === 'ArrowLeft') Cards.next(false); }
  if (Game.m && /^[1-4]$/.test(e.key)) Game.mAns(+e.key - 1);
  if (e.key === 'Escape') { if (c && c.q && !c.finished) Quiz.quit(); else closeOverlay(); }
});
document.addEventListener('submit', e => e.preventDefault());

/* ================= Start ================= */
S.scrollCur = true;
render();
setTimeout(() => { Sync.init(); Recog.init(); }, 0);
window.APP = { W, V, SECS, UNITS, Quiz, Recog, Pad, Cards, Game, get P() { return P; }, norm, rawVariants, acceptEn, acceptDe };

</script>
</body>
</html>
